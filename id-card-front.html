<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Card – Liyakhad Ali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400;600&family=Rajdhani:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-family: 'Exo 2', sans-serif;
    }

    .scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      filter: drop-shadow(0 30px 60px rgba(0, 0, 0, .7));
      animation: floatCard 4s ease-in-out infinite;
    }

    @keyframes floatCard {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .lanyard {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lanyard-strap {
      width: 6px;
      height: 60px;
      background: linear-gradient(180deg, #555 0%, #333 100%);
      border-radius: 2px 2px 0 0;
    }

    .lanyard-clip {
      width: 28px;
      height: 18px;
      background: linear-gradient(180deg, #888 0%, #444 100%);
      border-radius: 4px 4px 6px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lanyard-clip::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #222;
      border-radius: 50%;
      border: 1.5px solid #666;
    }

    .lanyard-hook {
      width: 20px;
      height: 12px;
      background: transparent;
      border: 4px solid #555;
      border-top: none;
      border-radius: 0 0 12px 12px;
    }

    .card-shell {
      width: 320px;
      height: 490px;
      background: linear-gradient(145deg, #303030 0%, #1e1e1e 100%);
      border-radius: 22px;
      padding: 6px;
      border: 1.5px solid #444;
      position: relative;
      clip-path: polygon(0% 6%, 3% 6%, 3% 10%, 0% 10%,
          0% 36%, 3% 36%, 3% 42%, 0% 42%,
          0% 100%, 100% 100%,
          100% 42%, 97% 42%, 97% 36%, 100% 36%,
          100% 10%, 97% 10%, 97% 6%, 100% 6%,
          100% 0%, 0% 0%);
    }

    .card {
      width: 100%;
      height: 100%;
      background: linear-gradient(160deg, #2c2c2c 0%, #1c1c1c 60%, #111 100%);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
          transparent 0%,
          transparent 38%,
          rgba(180, 180, 180, 0.08) 38%,
          rgba(200, 200, 200, 0.12) 52%,
          transparent 52%,
          transparent 100%);
      z-index: 1;
      pointer-events: none;
      animation: shimmerMove 5s ease-in-out infinite;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
          transparent 0%,
          transparent 55%,
          rgba(120, 120, 120, 0.06) 55%,
          rgba(150, 150, 150, 0.09) 65%,
          transparent 65%,
          transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    @keyframes shimmerMove {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }
    }

    .photo-area {
      position: absolute;
      bottom: 0;
      right: -10px;
      width: 210px;
      height: 420px;
      z-index: 2;
      overflow: hidden;
    }

    .photo-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .photo-placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.18);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      z-index: 2;
    }

    .photo-placeholder span {
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 2px;
      text-align: center;
    }

    /* photo-img shown by default when src is set */

    .card-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 28px 22px 24px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .name-block {
      max-width: 52%;
    }

    .card-name {
      font-family: 'Exo 2', sans-serif;
      font-weight: 200;
      font-size: 26px;
      line-height: 1.15;
      color: #fff;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .5);
    }

    .card-name .last {
      font-weight: 300;
    }

    .card-title {
      margin-top: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 400;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.65);
      text-transform: uppercase;
      line-height: 1.6;
    }

    .title-line {
      width: 28px;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.45);
      margin-top: 8px;
    }

    .card-footer {
      padding-bottom: 4px;
    }

    .id-label {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .id-sub {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 300;
      font-size: 9.5px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.55);
    }

    .card-logo {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      pointer-events: none;
    }

    .logo-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #666 0%, #2a2a2a 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Exo 2', sans-serif;
      font-weight: 700;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0;
      line-height: 1;
      text-align: center;
    }

    .logo-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 8px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
    }

    .scan-lines {
      position: absolute;
      bottom: 70px;
      left: 22px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 3;
      opacity: 0.18;
      pointer-events: none;
    }

    .scan-line {
      height: 1px;
      background: #fff;
      border-radius: 1px;
    }

    .barcode {
      position: absolute;
      bottom: 20px;
      left: 22px;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      pointer-events: none;
    }

    .barcode-bar {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 1px;
    }

    .card-glow {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 80px;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .upload-hint {
      position: absolute;
      bottom: 60px;
      right: 14px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.06);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 5px 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .upload-hint:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.5);
    }

    #file-input {
      display: none;
    }
  </style>
</head>

    const fileInput = document.getElementById('file-input');
    const photoImg = document.getElementById('photo-img');
    const placeholder = document.getElementById('photo-placeholder');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        photoImg.src = ev.target.result;
        photoImg.style.display = 'block';
        placeholder.style.display = 'none';
      };
      reader.readAsDataURL(file);
    });
